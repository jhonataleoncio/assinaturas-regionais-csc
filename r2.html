<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Eduardo Souza (R2) — CSC Veneza</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
      text-align: center;
    }
    h1 { color: #27561f; font-size: 24px; margin-bottom: 4px; }
    p.sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    img { max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      background: #367c2b;
      color: #fff;
      margin: 0 4px;
    }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Eduardo Souza</h1>
    <p class="sub">Regional 2 — Bahia / BA · Centro de Soluções Conectadas</p>
    <img src="eduardo.jpg" alt="Assinatura Eduardo Souza">
    <div>
      <a href="eduardo.jpg" target="_blank" class="btn">Abrir Imagem Direta (.jpg)</a>
      <a href="index.html" class="btn btn-secondary">Voltar ao Painel Geral</a>
    </div>
  </div>
</body>
</html>
